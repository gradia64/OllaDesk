[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olladesk"
version = "0.2.0"
description = "A native Linux desktop application for interacting with and managing local LLMs through Ollama, designed with Qt/PySide6"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
keyring = ["keyring>=24"]

[project.scripts]
olladesk = "olladesk.app:main"

[tool.setuptools]
packages = ["olladesk", "olladesk.widgets"]

[tool.setuptools.package-data]
olladesk = ["assets/*.svg"]
