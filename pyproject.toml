[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olladesk"
dynamic = ["version"]
description = "A native Linux desktop application for interacting with and managing local LLMs through Ollama, designed with Qt/PySide6"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
keyring = ["keyring>=24"]

[project.scripts]
olladesk = "olladesk.app:main"

[tool.setuptools]
packages = ["olladesk", "olladesk.widgets"]

[tool.setuptools.dynamic]
version = { attr = "olladesk.__version__" }   # unica fonte: olladesk/__init__.py

[tool.setuptools.package-data]
olladesk = ["assets/*.svg", "web/*"]
