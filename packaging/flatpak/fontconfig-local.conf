<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Installato come /app/etc/fonts/local.conf: la configurazione fontconfig di
  Flatpak lo include già.

  I font WOFF/WOFF2 dell'host (/run/host/fonts/woff: fonts-roboto-slab,
  fonts-font-awesome su Debian) dentro la sandbox risultano senza set di
  caratteri. Il Qt del runtime (6.11.2, QFontEngineMultiFontConfig::
  shouldLoadFontEngineForCharacter) non controlla l'esito di
  FcPatternGetCharSet e legge un puntatore non inizializzato: segfault al
  primo carattere che il font principale non ha (con Noto Sans, «➤»).
  Sono font per il web, inutili per un'interfaccia desktop: si escludono.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*.woff2</glob>
      <glob>*.woff</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
