<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>OllaDesk</title>
<!-- installazione sulla schermata Home: manifest (Android) e meta Apple (iOS) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2226" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OllaDesk">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="bar">
  <button id="back" class="icon" type="button" aria-label="Indietro" hidden>‹</button>
  <h1 id="title">OllaDesk</h1>
  <button id="new-chat" class="icon" type="button" aria-label="Nuova conversazione" hidden>＋</button>
  <button id="refresh" class="icon" type="button" aria-label="Aggiorna" hidden>↻</button>
</header>

<main>
  <section id="view-loading" class="view">
    <p class="muted center">Connessione…</p>
  </section>

  <section id="view-pair" class="view" hidden>
    <form id="pair-form" class="card" autocomplete="off">
      <h2>Abbina questo dispositivo</h2>
      <p class="muted">Sul PC apri OllaDesk, premi 📱 nella barra in alto e scrivi qui il codice di 6 cifre.</p>
      <input id="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             placeholder="000000" aria-label="Codice di abbinamento" required>
      <button type="submit" class="primary">Abbina</button>
      <p id="pair-error" class="error" role="alert" hidden></p>
    </form>
  </section>

  <section id="view-list" class="view" hidden>
    <ul id="chat-list" class="list"></ul>
    <p id="list-empty" class="muted center" hidden>Nessuna conversazione salvata.</p>
  </section>

  <section id="view-chat" class="view" hidden>
    <p id="chat-model" class="muted center small"></p>
    <div id="messages"></div>
  </section>

  <p id="net-error" class="error center" role="alert" hidden></p>
</main>

<form id="composer" class="composer" autocomplete="off" hidden>
  <p id="busy-note" class="muted small" hidden>Il PC sta rispondendo a un'altra richiesta: attendi la fine.</p>
  <div class="composer-tools">
    <select id="model" aria-label="Modello"></select>
    <button id="think" class="toggle" type="button" aria-pressed="true"
            title="Ragionamento (thinking)">🧠</button>
  </div>
  <div class="composer-row">
    <textarea id="input" rows="1" placeholder="Scrivi un messaggio…" aria-label="Messaggio"></textarea>
    <button id="send" class="send" type="submit" aria-label="Invia">➤</button>
  </div>
</form>
</body>
</html>
