# Test a ogni push/PR; sui tag v* anche build del .deb, lintian e upload
# sulla release. Le action sono fissate per SHA (commento = versione).
name: build-deb

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # i test non scrivono nulla; il job build alza a write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze di sistema (runtime Qt offscreen + validazione .desktop)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils libegl1 libgl1 \
            libxkbcommon0 libdbus-1-3 libfontconfig1
          desktop-file-validate olladesk.desktop

      - name: Dipendenze test (PySide6 per i worker Qt)
        run: python3 -m pip install --quiet PySide6

      - name: Test unitari
        run: python3 tests/unit_test.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Regressione ciclo di vita dei worker (nessuna rete)
        run: python3 tests/repro_qthread_crash.py

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessaria per creare la release e caricare il .deb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH dall'ultimo commit

      - name: Il tag corrisponde alla versione del codice
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' olladesk/__init__.py)"
          if [ "${GITHUB_REF_NAME#v}" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME ma olladesk/__init__.py dice $code"
            exit 1
          fi

      - name: Build .deb
        run: scripts/build-deb.sh

      - name: Lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on error,warning dist/*.deb

      - name: Artefatto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: deb
          path: dist/*.deb

      - name: Allega alla release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # se la release esiste già (creata a mano con le note) carica e basta
          gh release create "$tag" dist/*.deb --generate-notes --title "$tag" \
            || gh release upload "$tag" dist/*.deb --clobber
