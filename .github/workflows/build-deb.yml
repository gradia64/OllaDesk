# Build del pacchetto .deb: test unitari, build, allegato alla release su tag.
name: build-deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # necessaria per creare la release e caricare il .deb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test unitari
        run: python3 tests/unit_test.py

      - name: Validazione .desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate olladesk.desktop

      - name: Build .deb
        run: scripts/build-deb.sh

      - name: Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - name: Allega alla release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # se la release esiste già (creata a mano con le note) carica e basta
          gh release create "$tag" dist/*.deb --generate-notes --title "$tag" \
            || gh release upload "$tag" dist/*.deb --clobber
